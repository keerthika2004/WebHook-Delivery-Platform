services:
  # Register books: source of truth for apps, endpoints, events, deliveries, attempts, and outbox
  postgres:
    image: postgres:16-alpine
    container_name: hooklane-postgres
    environment:
      POSTGRES_DB: hooklane
      POSTGRES_USER: hooklane
      POSTGRES_PASSWORD: hooklane
    ports:
      # Host port 5434 -> container port 5432 (avoids colliding with local Postgres on 5432/5433)
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooklane -d hooklane"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Quick-notes whiteboard: API-key cache, circuit breakers, rate limiters, and live SSE pub/sub
  redis:
    image: redis:7-alpine
    container_name: hooklane-redis
    ports:
      # Host port 6380 -> container port 6379 (avoids colliding with other Redis containers on 6379)
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Conveyor belt with lanes: single-node Kafka 3.9 in KRaft mode (no ZooKeeper needed)
  kafka:
    image: apache/kafka:3.9.0
    container_name: hooklane-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # KRaft mode: this single container acts as both broker (stores messages) and controller (manages cluster metadata)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners so apps on your Mac connect via localhost:9092 AND containers later connect via kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker dev overrides (Kafka defaults to 3 replicas, which fails when you only run 1 broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
